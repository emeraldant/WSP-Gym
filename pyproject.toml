[project]
name = "weightgym"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "safetensors>=0.8.0",
    "scikit-learn>=1.9.1",
    "timm>=1.0.31",
    "tinker>=0.39.0",
    "tinker-cookbook>=0.6.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
